version: "2"
linters:
  default: none
  enable:
    - unused
    - ineffassign
    - staticcheck
    - unconvert
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/danieljustus/symaira-browse
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
