linters:
  enable:
    - unused        # dead imports, variables, functions
    - ineffassign   # ineffectual assignments
    - goimports     # import ordering and grouping
    - gosimple      # simplification opportunities
    - staticcheck   # comprehensive static analysis
    - unconvert     # unnecessary type conversions

linters-settings:
  goimports:
    local-prefixes: github.com/danieljustus/symaira-browse
