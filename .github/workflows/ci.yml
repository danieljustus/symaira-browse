name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    # No paths-ignore on pull requests: the branch protection ruleset
    # requires the PR checks, so every PR must report them (docs-only
    # PRs are cheap to verify).
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.26.6'
  RUST_VERSION: '1.98.0'
  CGO_ENABLED: '0'

jobs:
  pr-lint:
    name: PR / lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify approved A3 brand assets
        run: python3 scripts/test_brand_assets.py
      - name: Set up Rust
        run: rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: make fmt-check
      - name: Lint
        run: make lint
      - name: Check Rust formatting and lint
        run: make rust-lint

  pr-test:
    name: PR / test (ubuntu)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Set up Rust
        run: rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal
      - name: Install Rust security tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Build and test Rust workspace
        run: cargo build --workspace --locked && cargo test --workspace --all-features --locked
      - name: Verify Go/Rust contracts
        run: make rust-version-contract rust-core-contract rust-policy-contract rust-state-contract rust-mcp-contract rust-engine-contract rust-injection-contract rust-fetch-contract rust-session-contract rust-workflow-slice rust-safari-slice rust-browser-contract rust-daemon-contract rust-cdp-spike
      - name: Audit Rust dependencies and licenses
        run: make rust-security

  rust016-benchmark-evidence:
    name: RUST-016 / benchmark evidence (allowed to fail)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Set up Rust
        run: rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal
      - name: Build paired binaries
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/symbrowse-go 652453d1595fc302bd69c328e7da8a21dbee28b9
          trap 'git worktree remove /tmp/symbrowse-go >/dev/null 2>&1 || true' EXIT
          (cd /tmp/symbrowse-go && GOTOOLCHAIN=go${GO_VERSION} CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=v0.8.0" -o "$GITHUB_WORKSPACE/symbrowse-go" ./cmd/symbrowse)
          cargo build --release -p symbrowse-cli --bin symbrowse --locked
      - name: Run and compare raw evidence
        run: |
          python3 port/bench/run.py --go ./symbrowse-go --rust target/release/symbrowse --runs 30 --output port/results/rust016-benchmark.json
          python3 port/bench/compare.py docs/rust-port/baseline.json port/results/rust016-benchmark.json

  vulnerability-scan:
    name: PR / Go vulnerability scan
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Go vulnerability scan
        # At the introducing HEAD with Go 1.26.6, govulncheck finds no called
        # vulnerabilities.
        # GO-2026-5932 (x/crypto/openpgp) and GO-2026-5841
        # (klauspost/compress/s2) are required but not reachable. Keep this
        # assessment here so a future reachability change fails the gate.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  race:
    name: Main / race detector
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Race test
        run: CGO_ENABLED=1 go test -race -count=1 ./internal/daemon/... ./internal/engine/... ./internal/session/... ./internal/state/...

  coverage:
    name: PR / coverage gate
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Measure coverage
        id: coverage
        run: |
          set -euo pipefail
          go test -coverprofile=/tmp/coverage.out ./... >/dev/null 2>&1
          total=$(go tool cover -func=/tmp/coverage.out | tail -1 | awk '{gsub(/%/,"",$NF); print $NF}')
          refs=$(go tool cover -func=/tmp/coverage.out | grep 'stable_refs.go' | awk '{gsub(/%/,"",$NF); sum+=$NF; n++} END {print (n>0 ? sum/n : 0)}')
          # Per-package coverage is derived from the same profile (no extra
          # test runs): coverprofile lines carry the full package path, and
          # the default -coverpkg scopes each test binary to its own package,
          # so filtering by path == running the package tests separately.
          pkg_cov() {
            { head -1 /tmp/coverage.out; grep "$1" /tmp/coverage.out || true; } > /tmp/pkg.out
            if [ "$(wc -l < /tmp/pkg.out)" -le 1 ]; then echo 0; return; fi
            go tool cover -func=/tmp/pkg.out | tail -1 | awk '{gsub(/%/,"",$NF); print $NF}'
          }
          policy=$(pkg_cov '/internal/policy/')
          injection=$(pkg_cov '/internal/injection/')
          echo "total=${total}% refs=${refs}% policy=${policy}% injection=${injection}%"
          {
            echo "total=${total}"
            echo "refs=${refs}"
            echo "policy=${policy}"
            echo "injection=${injection}"
          } >> "$GITHUB_OUTPUT"
          fail=0
          [ "$(echo "$total >= 60" | bc)" = "1" ] || { echo "::error::total coverage ${total}% < 60% (R3: 65%-Ziel nach Merge aller Waves)"; fail=1; }
          [ "$(echo "$refs >= 85" | bc)" = "1" ] || { echo "::error::stable-ref coverage ${refs}% < 85%"; fail=1; }
          [ "$(echo "$policy >= 85" | bc)" = "1" ] || { echo "::error::policy coverage ${policy}% < 85%"; fail=1; }
          [ "$(echo "$injection >= 80" | bc)" = "1" ] || { echo "::error::injection coverage ${injection}% < 80%"; fail=1; }
          exit $fail
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: /tmp/coverage.out

  smoke:
    name: PR / e2e smoke (real Chrome)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Chrome
        # The apt google-chrome-stable build is proven on these runners by
        # the flows E2E job; the runner's snap-packaged root Chrome (whose
        # DevTools endpoint intermittently never appears) is replaced first.
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq google-chrome-stable >/dev/null 2>&1 || true
          fi
          google-chrome --version || true
      - name: E2E smoke (open → snapshot → fill → submit → read)
        run: SYMBROWSE_E2E=1 SYMBROWSE_HEADLESS=1 SYMBROWSE_CHROME_STARTUP_TIMEOUT=20 go test ./e2e/ -v -timeout 10m

  e2e-flows:
    name: PR / e2e flows (real Chrome)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Chrome
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq google-chrome-stable >/dev/null 2>&1 || true
          fi
          google-chrome --version || true
      - name: E2E flows (tabs, frames, dialogs, a11y, diff, record/replay)
        run: SYMBROWSE_E2E=1 SYMBROWSE_HEADLESS=1 SYMBROWSE_CHROME_STARTUP_TIMEOUT=45 go test ./internal/flows/ -v -timeout 15m

  fuzz-weekly:
    name: Fuzz / weekly (60s per target)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Fuzz refkey normalization
        run: go test ./internal/engine/ -run '^$' -fuzz '^FuzzRefKeyNormalization$' -fuzztime 60s
      - name: Fuzz snapshot serialization
        run: go test ./internal/engine/ -run '^$' -fuzz '^FuzzSnapshotSerialization$' -fuzztime 60s
      - name: Fuzz flow parser
        run: go test ./internal/flows/ -run '^$' -fuzz '^FuzzFlowParser$' -fuzztime 60s

  full-matrix:
    name: Main / full (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Set up Rust
        run: rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal --component rustfmt,clippy
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Rust build, lint and test
        run: cargo build --workspace --locked && cargo clippy --workspace --all-targets --all-features --locked -- -D warnings && cargo test --workspace --all-features --locked
      - name: Rust MCP stdio contract
        run: make rust-mcp-contract
      - name: MCP fixture generator isolation regressions
        run: python3 -m unittest scripts/rust-port/test_mcp_fixture_gen.py
      - name: Go/Rust version contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/port
          ext=""
          if [ "${RUNNER_OS}" = "Windows" ]; then ext=".exe"; fi
          python3 scripts/rust-port/pinned_oracle_build.py \
            --repo "${PWD}" --commit "652453d1595fc302bd69c328e7da8a21dbee28b9" \
            --release "v0.8.0" --output "${PWD}/target/port/symbrowse-go${ext}" \
            --go "go" --go-version "${GO_VERSION}"
          SYMBROWSE_VERSION=v0.8.0 cargo build -p symbrowse-cli --bin symbrowse --locked
          go run ./scripts/rust-port/cmd/sourcecheck \
            --oracle 652453d1595fc302bd69c328e7da8a21dbee28b9 \
            --paths internal/output/output.go,internal/output/human_renderers.go,internal/output/codes.go,internal/budget/budget.go,internal/config/config.go,internal/config/show.go
          go run ./scripts/rust-port/cmd/coregen --check --output testdata/port/core/output-budget-contract.json
          go run ./scripts/rust-port/cmd/configgen --check --output testdata/port/core/config-contract.json
          go run ./scripts/rust-port/cmd/diffharness \
            --left "./target/port/symbrowse-go${ext}" --right "./target/port/symbrowse-go${ext}" \
            --cases testdata/port/bootstrap/cases.json \
            --expect-oracle-commit 652453d1595fc302bd69c328e7da8a21dbee28b9 \
            --expect-oracle-release v0.8.0 --verify-left-go-revision
          go run ./scripts/rust-port/cmd/diffharness \
            --left "./target/port/symbrowse-go${ext}" --right "./target/debug/symbrowse${ext}" \
            --cases testdata/port/bootstrap/cases.json --stage version \
            --expect-oracle-commit 652453d1595fc302bd69c328e7da8a21dbee28b9 \
            --expect-oracle-release v0.8.0 --verify-left-go-revision
          go run ./scripts/rust-port/cmd/diffharness \
            --left "./target/port/symbrowse-go${ext}" --right "./target/debug/symbrowse${ext}" \
            --cases testdata/port/bootstrap/cases.json --stage config-output \
            --expect-oracle-commit 652453d1595fc302bd69c328e7da8a21dbee28b9 \
            --expect-oracle-release v0.8.0 --verify-left-go-revision
          go run ./scripts/rust-port/cmd/portbench \
            --binary "./target/port/symbrowse-go${ext}" \
            --workload version-json --runs 10 --output "${RUNNER_TEMP}/symbrowse-go-baseline.json"

  daemon-native:
    name: Rust daemon native (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Set up Rust
        run: rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal --component rustfmt,clippy
      - name: Prepare native daemon diagnostics
        run: python -c "from pathlib import Path; Path('target/ci/native-daemon').mkdir(parents=True, exist_ok=True)"
      - name: Compile daemon tests
        run: >-
          python -u scripts/rust-port/run_bounded.py
          --timeout 900
          --stdout target/ci/native-daemon/compile.stdout
          --stderr target/ci/native-daemon/compile.stderr
          -- cargo test -p symbrowse-daemon --all-features --locked --no-run
      - name: Run Windows platform tests individually
        if: runner.os == 'Windows'
        run: >-
          python -u scripts/rust-port/run_serial_cargo_tests.py
          --timeout 90
          --log-dir target/ci/native-daemon/platform-tests
          --repeat 5
          -- -p symbrowse-daemon --test platform --all-features --locked
      - name: Run non-Windows daemon unit tests
        if: runner.os != 'Windows'
        run: >-
          python -u scripts/rust-port/run_bounded.py
          --timeout 90
          --stdout target/ci/native-daemon/unit.stdout
          --stderr target/ci/native-daemon/unit.stderr
          -- cargo test -p symbrowse-daemon --lib --all-features --locked -- --nocapture --test-threads=1
      - name: Install daemon binary
        run: >-
          python -u scripts/rust-port/run_bounded.py
          --timeout 900
          --stdout target/ci/native-daemon/install.stdout
          --stderr target/ci/native-daemon/install.stderr
          -- cargo install --path crates/symbrowse-cli
          --root target/port/rust-install --locked --force
      - name: Run installed-binary daemon harness
        env:
          SYMBROWSE_RUST_BINARY: ${{ github.workspace }}/target/port/rust-install/bin/symbrowse${{ runner.os == 'Windows' && '.exe' || '' }}
        run: >-
          python -u scripts/rust-port/run_bounded.py
          --timeout 600
          --stdout target/ci/native-daemon/harness.stdout
          --stderr target/ci/native-daemon/harness.stderr
          -- python -u port/harness/run.py --suite daemon
      - name: Upload native daemon diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-daemon-diagnostics-${{ matrix.os }}
          path: target/ci/native-daemon
          if-no-files-found: warn
          retention-days: 14

  codeql:
    name: CodeQL / analysis
    # Weekly on main plus on every pull request that touches code, so
    # security findings surface on the branch before merge.
    if: github.event_name == 'schedule' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go
          build-mode: autobuild
      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
