name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      rust_dual_release:
        description: 'Build opt-in dual Go/Rust artifacts; Go remains the default'
        required: false
        type: boolean
        default: false

jobs:
  vulnerability-scan:
    name: Release / Go vulnerability scan
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: vulnerability-scan
    permissions:
      contents: write
      id-token: write # keyless Cosign signing
    runs-on: macos-15
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Import signing certificate
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "${CERTIFICATE_P12:-}" ]; then
            echo "::error::CERTIFICATE_P12 secret is not set; refusing to publish unsigned artifacts."
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.4.3'

      - name: Install syft
        # GoReleaser's sboms: pipeline catalogs archives with syft; the
        # binary must be on PATH or the release fails before publishing.
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Reset existing release for tag
        # A re-run against an already-published release fails every asset
        # upload with 422 already_exists and leaves the workflow red even
        # though the release is complete. Delete a pre-existing release
        # (the tag itself is kept) so GoReleaser can republish cleanly.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — deleting before republish"
            gh release delete "$TAG" --yes --cleanup-tag=false
          else
            echo "No existing release for $TAG — nothing to reset"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Notarize macOS binaries
        if: steps.signing.outputs.signed == 'true'
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
        run: |
          if [ -z "${NOTARY_API_KEY:-}" ] || [ -z "${NOTARY_API_KEY_ID:-}" ] || [ -z "${NOTARY_API_ISSUER:-}" ]; then
            echo "::error::Notary API secrets are required for signed release artifacts."
            exit 1
          fi
          NOTARY_KEY_PATH="$RUNNER_TEMP/notary-api-key.p8"
          if ! printf '%s' "$NOTARY_API_KEY" | base64 --decode > "$NOTARY_KEY_PATH"; then
            echo "::error::NOTARY_API_KEY is not valid base64-encoded App Store Connect key material."
            exit 1
          fi
          chmod 600 "$NOTARY_KEY_PATH"
          trap 'rm -f "$NOTARY_KEY_PATH"' EXIT
          for ARCH in amd64 arm64; do
            for f in "dist/*_darwin_${ARCH}"*/*; do
              if [ -f "$f" ] && file "$f" | grep -q "Mach-O"; then
                echo "Notarizing $f..."
                ZIP_PATH="$RUNNER_TEMP/notarize_${ARCH}.zip"
                ditto -c -k --keepParent "$f" "$ZIP_PATH"
                xcrun notarytool submit "$ZIP_PATH" \
                  --key "$NOTARY_KEY_PATH" \
                  --key-id "${NOTARY_API_KEY_ID}" \
                  --issuer "${NOTARY_API_ISSUER}" \
                  --wait
                rm -f "$ZIP_PATH"
              fi
            done
          done

      - name: Clean up signing material
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

  dual-rust-artifacts:
    name: Release / opt-in dual Go-Rust artifacts
    if: github.event_name == 'workflow_dispatch' && inputs.rust_dual_release == true
    needs: vulnerability-scan
    permissions:
      contents: read
      id-token: write
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - name: Set up Rust
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Build permitted dual targets
        env:
          GOTOOLCHAIN: go1.26.6
        run: |
          set -euo pipefail
          python3 port/release/build_dual.py \
            --version "${GITHUB_REF_NAME:-dual-${GITHUB_RUN_NUMBER}}" \
            --all-targets \
            --output target/rust016-dual
      - name: Prove unsigned output is not accepted
        run: |
          set -euo pipefail
          if python3 port/release/verify.py \
            --oracle-tag "${GITHUB_REF_NAME:-0.0.0}" \
            --candidate target/rust016-dual; then
            echo '::error::Unsigned or incomplete dual output passed the verifier.'
            exit 1
          fi
          echo 'Verifier correctly blocked unsigned/incomplete dual output.'
      - name: Upload dual build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust016-dual-${{ github.run_id }}
          path: target/rust016-dual
