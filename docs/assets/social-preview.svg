<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="8" fill="url(#accent)"/>
  <text x="80" y="180" font-family="Menlo, monospace" font-size="56" fill="#38bdf8">symbrowse</text>
  <text x="80" y="250" font-family="Menlo, monospace" font-size="30" fill="#cbd5e1">The browser an agent can operate —</text>
  <text x="80" y="300" font-family="Menlo, monospace" font-size="30" fill="#cbd5e1">while a person can take over at any time.</text>
  <text x="80" y="400" font-family="Menlo, monospace" font-size="22" fill="#64748b">Chrome CDP engine · static reader · sessions &amp; state · OOB handoff · flows · network control</text>
  <text x="80" y="540" font-family="Menlo, monospace" font-size="20" fill="#475569">Symaira · Apache-2.0 · symaira-browse</text>
</svg>
